<!DOCTYPE html>
<html>
<head>
  <title>My Scuba Diving Adventure</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f7ff;
      text-align: center;
      color: #003366;
    }

    h1 {
      color: #0077b6;
      font-size: 36px;
    }

    h1 + p {
      color: #005f99;
      font-weight: bold;
      background-color: #cceeff;
      border-radius: 10px;
    }

    .description::first-letter {
      font-size: 36px;
      color: #0096c7;
      font-weight: bold;
    }

    .dive-box {
      width: 420px;
      background-color: white;
      border: 3px solid #00b4d8;
      border-radius: 15px;
      margin: 20px auto;
      padding: 20px;
    }

    ul {
      padding: 0;
    }

    ul > li {
      list-style: none;
      background-color: #caf0f8;
      margin: 10px;
      padding: 12px;
      border: 2px solid #90e0ef;
      border-radius: 10px;
      font-weight: bold;
    }

    ul > li:nth-child(3) {
      background-color: #90e0ef;
      color: #003366;
    }

    ul > li:hover {
      background-color: #00b4d8;
      color: white;
      cursor: pointer;
      transform: scale(1.05);
    }

    button {
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 16px;
    }

    button:hover {
      background-color: #023e8a;
    }
  </style>

</head>

<body>

  <h1>My Scuba Diving Adventure</h1>

  <p>Explore the amazing ocean!</p>

  <p class="description">
    Scuba diving lets you swim with colorful fish and discover coral reefs.
  </p>

  <div class="dive-box">

    <h2>Things You Can See</h2>

    <ul>
      <li>Colorful Fish</li>
      <li>Sea Turtles</li>
      <li>Coral Reefs - Favorite</li>
      <li>Starfish</li>
      <li>Dolphins</li>
    </ul>

    <button>Start Diving</button>

  </div>

</body>
</html>
